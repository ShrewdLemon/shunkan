services:
  shunkan:
    build: .
    image: shunkan:local
    container_name: shunkan

    ports:
      # HOST-ONLY on purpose. "8720:8720" would publish on every interface and
      # hand an unauthenticated live broker session to your whole network,
      # which is also a Zerodha market-data licence violation. Do not widen
      # this without reading the terms section in the README.
      - "127.0.0.1:8720:8720"
      # Kite redirects the login to 127.0.0.1:8722/callback on the HOST. Without
      # this line `shunkan connect zerodha` hangs forever waiting for a request
      # that can never arrive.
      - "127.0.0.1:8722:8722"

    # Run as the host user so the bind mount below is readable and writable.
    # A named volume would have been tidier, but it starts empty: you would be
    # re-authenticating and, worse, starting a fresh instruments archive while
    # the one on your host keeps the history that can only accumulate forward.
    user: "${SHUNKAN_UID:-501}:${SHUNKAN_GID:-20}"

    volumes:
      # Your real ~/.shunkan: credentials, the paper book, the parquet archive.
      # Bind-mounted rather than copied, so the container and a bare
      # `shunkan serve` on the host share one state directory and cannot drift.
      - ${HOME}/.shunkan:/data

    environment:
      - SHUNKAN_HOME=/data
      - TZ=Asia/Kolkata

    # This is the "stop starting it from a terminal" part: it comes back on
    # boot and after a crash. Kite's daily token still needs a human once each
    # morning; nothing here works around that, by design.
    restart: unless-stopped
